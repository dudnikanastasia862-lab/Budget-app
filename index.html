<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Budget</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;min-height:100vh;padding:12px;background:#0a0a0a;color:#fff}
#R{position:fixed;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0a0a0a;z-index:100}
.T{font-size:48px;color:#d4a574;letter-spacing:10px;margin-bottom:60px}
.I{width:100%;max-width:400px;padding:18px;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,0.5);color:#fff;font-size:20px;text-align:center;margin-bottom:50px}
.G{display:flex;gap:20px;margin-bottom:40px;justify-content:center}
.B{flex:1;max-width:170px;padding:18px;font-size:14px;cursor:pointer;text-transform:uppercase;background:#2a2a2a;border:2px solid rgba(255,255,255,0.6);color:#fff}
.B.s{background:#fff;color:#000;border-color:#fff}
.Go{width:100%;max-width:300px;padding:18px;background:#3a3a3a;border:2px solid rgba(255,255,255,0.4);color:#fff;font-size:14px;cursor:pointer;text-transform:uppercase}
.Go:disabled{opacity:0.3}
header{padding:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;letter-spacing:2px;text-transform:uppercase;color:#d4a574}
.bal{text-align:right}
.balL{font-size:10px;margin-bottom:2px}
.balV{font-size:22px;font-weight:600}
.bO,.bR{padding:6px 12px;font-size:10px;cursor:pointer;text-transform:uppercase;background:#2a2a2a;border:2px solid currentColor;color:inherit}
.bud,.frm,.st,.tx,.ab{padding:15px;margin-bottom:12px;background:#1a1a1a;border:1px solid #333}
.sT{font-size:20px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.cd{padding:12px;text-align:center;background:#0a0a0a;border:1px solid #333}
.cL{font-size:10px;margin-bottom:6px}
.cV{font-size:20px;font-weight:600}
.bI{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.bI label,label{display:block;font-size:10px;margin-bottom:4px}
.bI input,input,select{width:100%;padding:8px;font-size:13px;background:#0a0a0a;border:1px solid #333;color:#fff}
.bS,.bA{margin-top:12px;width:100%;padding:10px;cursor:pointer;font-size:11px;text-transform:uppercase;background:#2a2a2a;border:2px solid currentColor;color:inherit}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sL{font-size:10px;margin-bottom:4px}
.sV{font-size:20px;font-weight:600}
.tg{display:flex;margin-bottom:12px;gap:6px}
.tB{flex:1;padding:10px;cursor:pointer;font-size:10px;text-transform:uppercase;background:#2a2a2a;border:2px solid currentColor;color:inherit}
.tB.s{background:#fff;color:#000;border-color:#fff}
.fG{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.fG .fl{grid-column:1/-1}
.tx{padding:8px 10px;margin-bottom:6px;border:1px solid #333;background:#0a0a0a}
.txT{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.txC{font-size:14px;font-weight:600}
.txA{font-size:16px;font-weight:600}
.txB{display:flex;justify-content:space-between;align-items:center}
.txP{font-size:9px;text-transform:uppercase;opacity:0.7}
.txD2{font-size:10px;opacity:0.7}
.txDl{position:absolute;top:4px;right:4px;width:20px;height:20px;cursor:pointer;font-size:12px;background:#2a2a2a;border:2px solid currentColor;color:inherit;display:flex;align-items:center;justify-content:center}
.todoItem{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:8px;border:1px solid #333;background:#0a0a0a}
.customCheck{width:20px;height:20px;min-width:20px;border:2px solid currentColor;cursor:pointer;display:flex;align-items:center;justify-content:center}
.customCheck.checked{background:currentColor}
.todoText{flex:1;font-size:13px}
.todoText.checked{text-decoration:line-through;opacity:0.5}
.todoDel{background:transparent;border:none;color:inherit;cursor:pointer;font-size:16px}
.todoAdd{display:flex;gap:8px;margin-top:10px}
.todoAdd input{flex:1;padding:8px;font-size:13px;background:#0a0a0a;border:2px solid currentColor;color:inherit}
.todoAdd button{padding:8px 16px;cursor:pointer;font-size:16px;background:#2a2a2a;border:2px solid currentColor;color:inherit}
.tabBar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:8px 0;background:#0a0a0a;border-top:1px solid #333}
.tabItem{display:flex;flex-direction:column;align-items:center;cursor:pointer;flex:1}
.tabIcon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:4px;border:2px solid rgba(255,255,255,0.6)}
.tabLabel{font-size:10px;color:rgba(255,255,255,0.7)}
.tabItem.active .tabIcon{background:#d4a574;border-color:#d4a574}
.tabItem.active .tabLabel{color:#d4a574;font-weight:600}
</style>
</head>
<body>
<div id="R">
<div class="T">BUDGET</div>
<input type="text" class="I" id="nI" placeholder="Ваше имя" maxlength="20">
<div class="G">
<button class="B" id="bF">Женский</button>
<button class="B" id="bM">Мужской</button>
</div>
<button class="Go" id="gB" disabled>Продолжить</button>
</div>

<div id="A" style="display:none">
<header>
<button class="bO" id="oB">Выйти</button>
<div class="logo">Budget</div>
<div style="display:flex;align-items:center;gap:8px">
<div class="bal">
<div class="balL">Ваш баланс</div>
<div class="balV" id="bV">0 ₽</div>
</div>
<button class="bR" id="rB">Сброс</button>
</div>
</header>

<div class="bud">
<div class="sT">Мой бюджет</div>
<div class="g3">
<div class="cd"><div class="cL">Наличные</div><div class="cV" id="cV">0 ₽</div></div>
<div class="cd"><div class="cL">Безналичные</div><div class="cV" id="dV">0 ₽</div></div>
<div class="cd"><div class="cL">Резерв</div><div class="cV" id="rV">0 ₽</div></div>
</div>
<div id="bB">
<div class="bI">
<div><label>Начальный баланс наличных</label><input type="number" id="iC" placeholder="0"></div>
<div><label>Начальный баланс карты</label><input type="number" id="iD" placeholder="0"></div>
<div><label>Начальный резерв</label><input type="number" id="iR" placeholder="0"></div>
</div>
<button class="bS" id="sB">Сохранить</button>
</div>
</div>

<div class="sts">
<div class="st"><div class="sL">Доходы</div><div class="sV" id="iV">0 ₽</div></div>
<div class="st"><div class="sL">Расходы</div><div class="sV" id="eV">0 ₽</div></div>
</div>

<div class="frm">
<div class="sT">Добавить запись</div>
<div class="tg">
<button class="tB s" id="tE">Расход</button>
<button class="tB" id="tI">Доход</button>
<button class="tB" id="tTr">Перевод</button>
</div>
<form id="tF">
<div class="fG">
<div><label>Категория</label><select id="cS" required></select></div>
<div><label>Сумма (₽)</label><input type="number" id="aI" placeholder="0" min="0" required></div>
<div><label>Способ оплаты</label><select id="pS"><option value="cash">Наличные</option><option value="card">Безналичные</option></select></div>
<div><label>Дата</label><input type="date" id="dI" required></div>
<div class="fl"><label>Описание</label><input type="text" id="dS" placeholder="Необязательно"></div>
</div>
<button type="submit" class="bA" id="addBtn">Добавить</button>
</form>
<form id="trF" style="display:none">
<div class="fG">
<div><label>Откуда</label><select id="trFrom"><option value="cash">Наличные</option><option value="card">Безналичные</option></select></div>
<div><label>Куда</label><select id="trTo"><option value="card">Безналичные</option><option value="cash">Наличные</option></select></div>
<div class="fl"><label>Сумма (₽)</label><input type="number" id="trAmt" placeholder="0" min="0" required></div>
<div class="fl"><label>Описание</label><input type="text" id="trDsc" placeholder="Необязательно"></div>
</div>
<button type="submit" class="bA">Перевести</button>
</form>
</div>

<div class="sT">Мои записи</div>
<div id="recordsGrid">
<div id="expList"></div>
<div id="incList"></div>
</div>
</div>

<div id="listScr" style="display:none">
<header><div style="width:80px"></div><div class="logo">СПИСОК</div><div style="width:80px"></div></header>
<div class="bud">
<div class="sT">Список покупок</div>
<div class="todoAdd">
<input type="text" id="todoInput" placeholder="Что купить...">
<button onclick="addTodo()">+</button>
</div>
<div id="todoList"></div>
</div>
</div>

<div class="tabBar">
<div class="tabItem active" data-page="A">
<div class="tabIcon">📊</div>
<div class="tabLabel">Главная</div>
</div>
<div class="tabItem" data-page="listScr">
<div class="tabIcon">📝</div>
<div class="tabLabel">Список</div>
</div>
</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBzzbsIq-ercysxRQl1wEFHWVKPOgAkd38",
  authDomain: "budget-app-82758.firebaseapp.com",
  projectId: "budget-app-82758",
  storageBucket: "budget-app-82758.firebasestorage.app",
  messagingSenderId: "414241966369",
  appId: "1:414241966369:web:301d44330ed8c233531660"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let userId = localStorage.getItem('budget_user_id');
if (!userId) {
  userId = 'user_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now().toString(36);
  localStorage.setItem('budget_user_id', userId);
}

const userRef = doc(db, 'users', userId);
const txRef = collection(userRef, 'transactions');

const EC = ['Продукты', 'Для дома', 'Бытовая химия', 'Коммунальные услуги', 'Связь', 'Автомобиль', 'Транспорт', 'Маркетплейсы', 'Рестораны', 'Одежда', 'Отдых', 'Развлечения', 'Аптеки', 'Красота', 'Другое'];
const IC = ['Зарплата', 'Премия', 'Входящий перевод', 'Фриланс', 'Подработка', 'Кэшбэк'];

let tx = [], bud = { c: 0, d: 0, r: 0, s: false }, todos = [], gen = null, nm = '', cT = 'expense';
const $ = id => document.getElementById(id);

function fbSave(data) { setDoc(userRef, data, { merge: true }).catch(() => {}); }
function fbAddTx(d) { addDoc(txRef, d).catch(() => {}); }
function fbDeleteTx(id) {
  getDocs(txRef).then(s => {
    s.forEach(d => { if (d.data().id === id) deleteDoc(d.ref).catch(() => {}); });
  }).catch(() => {});
}

function renderTodos() {
  const c = $('todoList');
  if (!todos.length) { c.innerHTML = '<div style="text-align:center;padding:20px;opacity:0.6">Список пуст</div>'; return; }
  c.innerHTML = todos.map(t => `
    <div class="todoItem">
      <div class="customCheck ${t.checked ? 'checked' : ''}" onclick="toggleCheck('${t.id}')">✓</div>
      <div class="todoText ${t.checked ? 'checked' : ''}">${t.text}</div>
      <button class="todoDel" onclick="deleteTodo('${t.id}')">×</button>
    </div>
  `).join('');
}

window.addTodo = function() {
  const i = $('todoInput'), t = i.value.trim();
  if (!t) return;
  todos.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: t, checked: false });
  fbSave({ todos });
  i.value = '';
  renderTodos();
};

window.toggleCheck = function(id) {
  const t = todos.find(x => x.id === id);
  if (t) { t.checked = !t.checked; fbSave({ todos }); renderTodos(); }
};

window.deleteTodo = function(id) {
  todos = todos.filter(x => x.id !== id);
  fbSave({ todos });
  renderTodos();
};

$('bF').onclick = function() { $('bF').classList.add('s'); $('bM').classList.remove('s'); gen = 'female'; ck(); };
$('bM').onclick = function() { $('bM').classList.add('s'); $('bF').classList.remove('s'); gen = 'male'; ck(); };
$('nI').oninput = ck;

function ck() { $('gB').disabled = !($('nI').value.trim() && gen); }

$('gB').onclick = async function() {
  nm = $('nI').value.trim();
  if (!nm || !gen) return;
  fbSave({ nm, gen, bud, todos: [] });
  localStorage.setItem('budget_user_info', JSON.stringify({ nm, gen }));
  op();
};

$('oB').onclick = async function() {
  if (!confirm('Выйти? Все данные будут удалены.')) return;
  deleteDoc(userRef).catch(() => {});
  localStorage.removeItem('budget_user_id');
  localStorage.removeItem('budget_user_info');
  location.reload();
};

function showPage(id) {
  $('A').style.display = 'none';
  $('listScr').style.display = 'none';
  $(id).style.display = 'block';
}

document.querySelectorAll('.tabItem').forEach(item => {
  item.onclick = function() {
    document.querySelectorAll('.tabItem').forEach(i => i.classList.remove('active'));
    this.classList.add('active');
    showPage(this.dataset.page);
  };
});

function op() {
  $('R').style.display = 'none';
  $('A').style.display = 'block';
  fc();
  rn();
}

async function ld() {
  try {
    const ud = await getDoc(userRef);
    if (ud.exists()) {
      const d = ud.data();
      if (d.nm) { nm = d.nm; gen = d.gen; localStorage.setItem('budget_user_info', JSON.stringify({ nm, gen })); }
      if (d.bud) bud = d.bud;
      if (d.todos && Array.isArray(d.todos)) todos = d.todos;
    }
    const ts = await getDocs(txRef);
    tx = [];
    ts.forEach(d => { tx.push(d.data()); });
  } catch (e) { console.error('Load error:', e); }
}

$('sB').onclick = function() {
  bud = { c: parseFloat($('iC').value) || 0, d: parseFloat($('iD').value) || 0, r: parseFloat($('iR').value) || 0, s: true };
  fbSave({ bud });
  rn();
};

$('rB').onclick = function() {
  if (!confirm('Сбросить все данные?')) return;
  tx = [];
  todos = [];
  bud = { c: 0, d: 0, r: 0, s: false };
  setDoc(userRef, { bud, todos, tx: [] }, { merge: true }).catch(() => {});
  $('bB').style.display = 'block';
  $('iC').value = '';
  $('iD').value = '';
  $('iR').value = '';
  rn();
  alert('Очищено');
};

$('tE').onclick = function() { $('tE').classList.add('s'); $('tI').classList.remove('s'); $('tTr').classList.remove('s'); cT = 'expense'; $('tF').style.display = 'block'; $('trF').style.display = 'none'; fc(); };
$('tI').onclick = function() { $('tI').classList.add('s'); $('tE').classList.remove('s'); $('tTr').classList.remove('s'); cT = 'income'; $('tF').style.display = 'block'; $('trF').style.display = 'none'; fc(); };
$('tTr').onclick = function() { $('tTr').classList.add('s'); $('tE').classList.remove('s'); $('tI').classList.remove('s'); $('tF').style.display = 'none'; $('trF').style.display = 'block'; };
$('trFrom').onchange = function() { $('trTo').value = $('trFrom').value === 'cash' ? 'card' : 'cash'; };

function fc() {
  const s = $('cS'), c = cT === 'expense' ? EC : IC;
  s.innerHTML = c.map(x => `<option value="${x}">${x}</option>`).join('');
}

function fm(n) { return new Intl.NumberFormat('ru-RU').format(n) + ' ₽'; }
function fd(d) { const p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }); }
function walletName(w) { return w === 'cash' ? 'Наличные' : 'Безналичные'; }

function rn() {
  const inc = tx.filter(t => t.t === 'income').reduce((s, t) => s + t.a, 0);
  const exp = tx.filter(t => t.t === 'expense').reduce((s, t) => s + t.a, 0);
  const ci = tx.filter(t => t.t === 'income' && t.p === 'cash').reduce((s, t) => s + t.a, 0);
  const ce = tx.filter(t => t.t === 'expense' && t.p === 'cash').reduce((s, t) => s + t.a, 0);
  const di = tx.filter(t => t.t === 'income' && t.p === 'card').reduce((s, t) => s + t.a, 0);
  const de = tx.filter(t => t.t === 'expense' && t.p === 'card').reduce((s, t) => s + t.a, 0);
  const cb = bud.c + ci - ce;
  const db2 = bud.d + di - de;
  const tb = cb + db2;

  $('iV').textContent = fm(inc);
  $('eV').textContent = fm(exp);
  $('cV').textContent = fm(cb);
  $('dV').textContent = fm(db2);
  $('rV').textContent = fm(bud.r);
  $('bV').textContent = fm(tb);
  $('bB').style.display = bud.s ? 'none' : 'block';
  $('iC').value = bud.c || '';
  $('iD').value = bud.d || '';
  $('iR').value = bud.r || '';

  const s = [...tx].sort((a, b) => {
    const pa = a.d.split('-'), pb = b.d.split('-');
    return new Date(+pb[0], +pb[1] - 1, +pb[2]) - new Date(+pa[0], +pa[1] - 1, +pa[2]);
  });
  const expenses = s.filter(t => t.t === 'expense');
  const incomes = s.filter(t => t.t === 'income');

  $('expList').innerHTML = expenses.length === 0 ? '<div style="text-align:center;padding:20px;opacity:0.6">Нет расходов</div>' :
    expenses.map(t => `
      <div class="tx" style="position:relative">
        <button class="txDl" data-id="${t.id}" onclick="deleteTx('${t.id}')">×</button>
        <div class="txT">
          <div><span class="txC">${t.c}</span></div>
          <div class="txA">−${fm(t.a)}</div>
        </div>
        <div class="txB">
          <div class="txP">${walletName(t.p)}</div>
          <div class="txD2">${fd(t.d)}</div>
        </div>
      </div>
    `).join('');

  $('incList').innerHTML = incomes.length === 0 ? '<div style="text-align:center;padding:20px;opacity:0.6">Нет доходов</div>' :
    incomes.map(t => `
      <div class="tx" style="position:relative">
        <button class="txDl" data-id="${t.id}" onclick="deleteTx('${t.id}')">×</button>
        <div class="txT">
          <div><span class="txC">${t.c}</span></div>
          <div class="txA">+${fm(t.a)}</div>
        </div>
        <div class="txB">
          <div class="txP">${walletName(t.p)}</div>
          <div class="txD2">${fd(t.d)}</div>
        </div>
      </div>
    `).join('');
}

window.deleteTx = function(id) {
  if (!confirm('Удалить?')) return;
  tx = tx.filter(t => t.id !== id);
  fbDeleteTx(id);
  rn();
};

$('dI').valueAsDate = new Date();

$('tF').onsubmit = function(e) {
  e.preventDefault();
  const a = parseFloat($('aI').value);
  if (!a || a <= 0) return;
  const nt = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: cT, c: $('cS').value, a, p: $('pS').value, d: $('dI').value, dsc: $('dS').value.trim() };
  tx.push(nt);
  fbAddTx(nt);
  rn();
  e.target.reset();
  $('dI').valueAsDate = new Date();
  fc();
};

$('trF').onsubmit = function(e) {
  e.preventDefault();
  const amt = parseFloat($('trAmt').value);
  const from = $('trFrom').value;
  const to = $('trTo').value;
  const dsc = $('trDsc').value.trim();
  if (!amt || amt <= 0) { alert('Введите сумму'); return; }
  if (from === to) { alert('Откуда и Куда должны быть разными'); return; }
  const ci = tx.filter(t => t.t === 'income' && t.p === 'cash').reduce((s, t) => s + t.a, 0);
  const ce = tx.filter(t => t.t === 'expense' && t.p === 'cash').reduce((s, t) => s + t.a, 0);
  const di = tx.filter(t => t.t === 'income' && t.p === 'card').reduce((s, t) => s + t.a, 0);
  const de = tx.filter(t => t.t === 'expense' && t.p === 'card').reduce((s, t) => s + t.a, 0);
  const cb = bud.c + ci - ce;
  const db2 = bud.d + di - de;
  const av = from === 'cash' ? cb : db2;
  if (amt > av) { alert('Недостаточно средств в ' + walletName(from)); return; }
  if (from === 'cash') { bud.c -= amt; bud.d += amt; } else { bud.d -= amt; bud.c += amt; }
  const nt = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: 'transfer', c: 'Перевод', a: amt, p: from, pTo: to, d: $('dI').value || new Date().toISOString().split('T')[0], dsc: dsc || (walletName(from) + ' → ' + walletName(to)) };
  tx.push(nt);
  fbAddTx(nt);
  fbSave({ bud });
  $('trAmt').value = '';
  $('trDsc').value = '';
  rn();
};

const cachedInfo = localStorage.getItem('budget_user_info');
if (cachedInfo) {
  const info = JSON.parse(cachedInfo);
  nm = info.nm;
  gen = info.gen;
}

(async () => {
  await ld();
  if (nm && gen) {
    op();
    renderTodos();
  } else {
    $('R').style.display = 'flex';
    $('A').style.display = 'none';
  }
})();
</script>
