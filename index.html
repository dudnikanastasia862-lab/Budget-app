<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Budget - Диагностика</title>
<style>
body{font-family:sans-serif;padding:20px;background:#000;color:#fff}
.box{background:#1a1a1a;padding:15px;margin:10px 0;border:1px solid #d4a574;border-radius:8px}
.err{color:#ff4444;font-weight:bold}
.ok{color:#22c55e}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#000;padding:10px;border-radius:4px}
</style>
</head>
<body>
<h1>🔍 Диагностика</h1>
<div class="box" id="status">Загрузка...</div>
<div class="box" id="error" style="display:none"></div>
<div class="box" id="info"></div>

<script>
window.onerror = function(msg, url, line, col, err) {
  document.getElementById('status').innerHTML = '<span class="err">❌ Ошибка в коде!</span>';
  document.getElementById('error').style.display = 'block';
  document.getElementById('error').innerHTML = 
    '<b>Сообщение:</b><br>' + msg + '<br><br>' +
    '<b>Строка:</b> ' + line + '<br><br>' +
    '<b>Колонка:</b> ' + col + '<br><br>' +
    (err ? '<b>Стек:</b><br><pre>' + err.stack + '</pre>' : '');
  return true;
};
document.getElementById('status').innerHTML = '<span class="ok">✅ Скрипт запустился</span>';
document.getElementById('info').innerHTML = '<b>User ID:</b><br><pre>' + localStorage.getItem('budget_user_id') + '</pre><br><b>User Info:</b><br><pre>' + localStorage.getItem('budget_user_info') + '</pre>';
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

try {
  const firebaseConfig = {apiKey:"AIzaSyBzzbsIq-ercysxRQl1wEFHWVKPOgAkd38",authDomain:"budget-app-82758.firebaseapp.com",projectId:"budget-app-82758",storageBucket:"budget-app-82758.firebasestorage.app",messagingSenderId:"414241966369",appId:"1:414241966369:web:301d44330ed8c233531660"};
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  document.getElementById('info').innerHTML += '<br><b>Firebase:</b> <span class="ok">✅ Подключён</span>';
} catch(e) {
  document.getElementById('info').innerHTML += '<br><b>Firebase:</b> <span class="err">❌ ' + e.message + '</span>';
}
</script>
</body>
</html>
